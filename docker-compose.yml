# Deployment: sheets-mcp (streamable HTTP) + optional Cloudflare Tunnel sidecar.
#
# Two ways to get public HTTPS in front of the server:
#   1. You already run cloudflared (or any reverse proxy) elsewhere on your
#      network: start only the server, publish its port with the local
#      override, and point your tunnel's ingress at <host-ip>:8080.
#        docker compose -f docker-compose.yml -f docker-compose.local.yml up -d sheets-mcp
#   2. No existing tunnel: enable the bundled sidecar with the "tunnel"
#      profile (requires TUNNEL_TOKEN in .env). The server then stays off any
#      host port; the tunnel is the only way in.
#        docker compose --profile tunnel up -d
#
# All secrets live in .env (see .env.example). Never commit .env.

services:
  sheets-mcp:
    build: .
    image: mcp-google-sheets:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # Outbound: whose Google identity the tools use.
      # service_account (default) uses CREDENTIALS_CONFIG below; user = each
      # caller's own Google token (requires AUTH_ENABLED=true).
      AUTH_OUTBOUND_MODE: ${AUTH_OUTBOUND_MODE:-service_account}
      # Service account (base64 JSON) — used only in service_account mode.
      CREDENTIALS_CONFIG: ${CREDENTIALS_CONFIG:-}
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID:-}
      # Inbound: MCP OAuth for claude.ai
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      AUTH_JWT_SIGNING_KEY: ${AUTH_JWT_SIGNING_KEY:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS}
      # Tool whitelist: excludes share_spreadsheet on purpose
      ENABLED_TOOLS: ${ENABLED_TOOLS:-list_sheets,get_sheet_data,get_sheet_formulas,update_cells,batch_update_cells,add_rows,list_spreadsheets}
    networks:
      - mcp-internal
    # Intentionally no "ports": only cloudflared can reach this service.

  cloudflared:
    # Started only with:  docker compose --profile tunnel up -d
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - sheets-mcp
    networks:
      - mcp-internal

networks:
  mcp-internal:
    driver: bridge
