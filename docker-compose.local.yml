# Port-publish override — exposes the MCP server on a host port instead of
# keeping it internal-only.
#
# Use this in EITHER of these situations:
#   1. Local smoke test before any tunnel is involved, or
#   2. Your cloudflared runs on a different machine, so it must reach this
#      server over the LAN at <this-host-ip>:8088.
#
# Start with: ./start.sh
#
# Auth still protects every request (401 without a valid token), but note the
# port is reachable by anything on the LAN. Bind it tighter if you need to.
services:
  sheets-mcp:
    restart: unless-stopped
    ports:
      # host 8088 -> container 8000. Reachable at http://localhost:8088 and
      # http://<this-host-lan-ip>:8088.
      - "8088:8000"
